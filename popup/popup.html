<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple currency converter</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="wrapper">
        <h1 class="popup-header">Простой конвертер валют</h1>
        <label for="base-currency">Валюта, в которую будет производиться конвертация:</label>
        <select id="base-currency">
            <option value="">Выберите валюту</option>
        </select>
        <div class="status">
            <div class="status-message" id="status"></div>
            <button id="refresh">Обновить</button>
        </div>
        <div id="updated" class="muted"></div>

    </div>

    <script src="popup.js"></script>
</body>
</html>
